glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    typos:
      run: mise x -- typos
    ruff-format:
      glob: "**/*.{py,pyi}"
      run: mise x -- just fmt
      stage_fixed: true
    ruff-lint:
      glob: "**/*.{py,pyi}"
      run: mise x -- just lint-static lint-defensive
    workflows:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise x -- actionlint
    secrets:
      run: mise x -- gitleaks dir --redact --no-banner .

commit-msg:
  commands:
    conventional:
      run: mise x -- committed --commit-file {1}

pre-push:
  piped: true
  commands:
    text:
      run: mise x -- just lint-text
    app:
      glob:
        - "src/**"
        - "tests/**"
        - "scripts/**"
        - "pyproject.toml"
        - "uv.lock"
        - "Dockerfile"
        - ".dockerignore"
        - "docker-compose.{yml,yaml}"
        - "Justfile"
        - "mise.toml"
        - "lefthook.yml"
        - ".github/filters/ci.yml"
        - ".github/workflows/ci.yml"
        - ".github/workflows/release.yml"
      run: mise x -- just verify-app

name: Distribution check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: v2026.11.10
          sha256: b603a4f48563fc379a794d9ea2cf9f709ed276c9141068604cb0c59fa3e674a9
          install_args: just lefthook actionlint typos gitleaks ubi:crate-ci/committed ripgrep
      - run: mise x -- just docker-build ci package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distribution-${{ github.sha }}
          path: |
            dist/
            bom.json
          if-no-files-found: error
          retention-days: 7

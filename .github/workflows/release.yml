name: Distribution check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: just lefthook actionlint typos gitleaks ubi:crate-ci/committed ripgrep
      - run: mise x -- just docker-build ci package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distribution-${{ github.sha }}
          path: |
            dist/
            bom.json
          if-no-files-found: error
          retention-days: 7

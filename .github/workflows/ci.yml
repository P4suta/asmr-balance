name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: >-
            ${{ github.event.merge_group.base_sha ||
            github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - name: Validate selection
        env:
          APP_FILTER: ${{ steps.changes.outputs.app }}
        run: jq -en --arg app "$APP_FILTER" '$app == "true" or $app == "false"'
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: just lefthook actionlint typos gitleaks ubi:crate-ci/committed ripgrep
      - run: mise x -- just lint-text

  app:
    needs: [quality]
    if: needs.quality.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          install_args: just ripgrep
      - run: mise x -- just docker-build verify-app

  required:
    name: required
    if: always()
    needs: [quality, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the selected work
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -en --argjson needs "$NEEDS" '
            $needs |
            (keys == ["app", "quality"]) and
            (.quality.result == "success") and
            (.quality.outputs.app | IN("true", "false")) and
            (.app.result == (
              if .quality.outputs.app == "true" then "success"
              else "skipped" end
            ))
          '

[project]
name = "asmr-balance"
version = "1.0.0"
description = "Listener-facing ASMR pre-listening checker — diagnoses L/R balance, loudness, true-peak / clipping risk, and band-level bias so listeners pick the right playback gear and volume (ITU-R BS.1770 based; Parquet/HTML/TUI reports)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Yasunobu", email = "42543015+P4suta@users.noreply.github.com" }]
keywords = ["asmr", "audio", "stereo", "loudness", "bs1770", "lufs", "balance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "av",
    "polars",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "typer",
    "rich",
    "structlog",
    "jinja2",
    "plotly",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
asmr-balance = "asmr_balance.cli:app"
asmr-balance-web = "asmr_balance.web.cli:main"

[project.urls]
Homepage = "https://github.com/P4suta/asmr-balance"
Repository = "https://github.com/P4suta/asmr-balance"
Issues = "https://github.com/P4suta/asmr-balance/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asmr_balance"]

# Hatchling's default wheel include is .py / .pyi / py.typed only. The web
# layer ships HTML templates and CSS / JS as package data, so list them via
# force-include — same source path → same wheel path.
[tool.hatch.build.targets.wheel.force-include]
"src/asmr_balance/web/templates" = "asmr_balance/web/templates"
"src/asmr_balance/web/static" = "asmr_balance/web/static"

[tool.uv]
required-version = ">=0.7"

[dependency-groups]
dev = [
    "ruff",
    "ty>=0.0.59",
    "bandit",
    "vulture",
    "pre-commit",
    "pip-audit",
    "cyclonedx-py",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-randomly",
    "pytest-benchmark",
    "hypothesis",
    "mutmut",
    "pyloudnorm",
    "httpx",
]
docs = [
    "mkdocs-material",
    "pdoc",
]
release = [
    "python-semantic-release",
    "git-cliff",
]

# ----------------------------------------------------------------------
# ruff — Day 0 strict: select = ["ALL"] minus a minimal explicit ignore
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# 明示 ignore は理由のあるものだけ。ad-hoc な silencing は禁止
ignore = [
    # docstring requirements: 関数/クラス内 docstring は強制せず、module/public-API のみ強制
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    # formatter conflicts
    "COM812", # trailing-comma — ruff format 競合
    "ISC001", # implicit-str-concat — ruff format 競合
    # 不要規約
    "CPY001", # copyright header
    "TD002", "TD003", # TODO author/date (代わりに defensive grep で issue link を強制)
    # numpy/audio 文化と衝突するもの
    "PLR0913", # function arg count >= 5 — DSP は引数多い
    # pydantic 競合: model field の型は runtime に必要なので TYPE_CHECKING へ移せない
    "TC001", "TC002", "TC003",
    # typer は subcommand 引数で bool default 値を要求する
    "FBT001", "FBT002",
    # 人間可読 unicode (Δ, −, ×, ≥ など) は明示的に使う
    "RUF001", "RUF002",
    # 数式/DSP のテストは比較定数が多い
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert allowed in tests
    "PLR2004", # magic value allowed in tests
    "INP001", # __init__.py not required
    "D", # tests need no docstrings
    "ANN", # tests need no full annotations
    "SLF001", # private-member access (white-box test)
    "S108", # /tmp paths in synthetic Path() constructors
    "S404", "S603", "S607", # ffmpeg subprocess usage in fixtures (vetted args)
    "PLC0415", # local imports inside test functions are deliberate
    "PLR0124", # ``value != value`` is the canonical NaN check
    "N802",    # test names may contain dB / Hz units (e.g. test_yields_zero_dB_imbalance)
    "ARG001",  # unused pytest fixtures (tmp_path) are pinned by signature
    "E741",    # one-letter variable names mirror DSP conventions (l, r)
]
"docs/**" = ["INP001", "D"]
"tests/fixtures/gen_fixtures.py" = ["S311", "S404", "S603", "S607"]
"scripts/run_mutmut.py" = [
    "INP001", "ANN401", "ANN202", "DTZ005", "PLC0415", "TRY300", "PERF401",
]
"src/asmr_balance/sink/base.py" = ["PLC0415"]  # circular-import avoidance in build_sinks
"src/asmr_balance/scan/__init__.py" = ["PLC0415"]
"src/asmr_balance/cli.py" = ["PLC0415"]
"src/asmr_balance/source/backend/pyav.py" = ["PLC0415"]      # local ProbedAudio import avoids cycle
"src/asmr_balance/source/backend/soundfile.py" = ["PLC0415"]
"src/asmr_balance/graph/scheduler.py" = ["S101"]              # isinstance narrowing for type checkers

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["asmr_balance"]
combine-as-imports = true

# ----------------------------------------------------------------------
# ty (astral) — Rust-based type checker, replacing basedpyright
# ----------------------------------------------------------------------
# Rule levels mirror the previous basedpyright stance: third-party stub
# gaps (polars / starlette extras / jinja2 env globals) and white-box
# frozen-dataclass test patterns are demoted to ``warn`` so they don't fail
# CI, while real type bugs in our own surface stay ``error``.
[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.mutmut-cache",
    "mutants",
    "tests/legacy",
]

# Rule levels intentionally left at defaults — every diagnostic is either
# fixed in code (real type bug) or silenced inline with ``# ty: ignore[<rule>]``
# at the exact line that intentionally exercises the rejected path (frozen-
# dataclass tests / Pydantic ``extra="forbid"`` tests / library stub gaps).

# ----------------------------------------------------------------------
# pytest — strict + branch coverage 100%
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg", "venv", "tests/legacy"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-branch",
    "--cov-fail-under=100",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-n", "auto",
    "--benchmark-disable",
    "--hypothesis-show-statistics",
]
filterwarnings = [
    "error",  # warning → test failure
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
]
markers = [
    "slow: 1 秒以上かかる test",
    "bench: pytest-benchmark のみで走らせる",
    "property: hypothesis property test",
    "regression: pyloudnorm 等の external reference 比較",
    "e2e: scan end-to-end test",
]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------
# hypothesis — CI profile
# ----------------------------------------------------------------------
[tool.hypothesis]
# profile は conftest で register、ここはマーカーだけ

# ----------------------------------------------------------------------
# mutmut — kill rate >= 80% を CI gate に
# ----------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = ["src/asmr_balance"]
# Limit to fast unit tests; e2e/property tests are slow and dominate the
# mutation budget. dsp/analyzers/flags/types/config/logging are all covered
# by tests/unit; pipeline+report still get exercised indirectly via test_cli.py.
tests_dir = ["tests/unit"]
# mutmut 3.x calls ``pytest.main()`` in-process; xdist spawns subprocesses
# that lose ``mutmut.config``, so we disable it.
pytest_add_cli_args = [
    "-o", "addopts=",
    "-p", "no:xdist",
    "-p", "no:randomly",
    "-p", "no:benchmark",
    "-p", "no:cacheprovider",
]

# ----------------------------------------------------------------------
# bandit
# ----------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "docs", "mutants"]
skips = ["B101"]  # isinstance asserts in graph/scheduler.py are type-narrowing aids

# ----------------------------------------------------------------------
# python-semantic-release
# ----------------------------------------------------------------------
[tool.semantic_release]
version_variables = ["src/asmr_balance/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): {version}\n\n[skip ci]"
tag_format = "v{version}"
build_command = "uv build"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["chore\\(release\\):.*"]

[tool.semantic_release.publish]
upload_to_vcs_release = true
